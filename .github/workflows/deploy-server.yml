# Deploy do servidor no Fly.io (não é mais usado; Render é o padrão agora).
# Mantido para migração futura. Trigger manual: Actions → Deploy server → Run workflow.
# Requer o secret FLY_API_TOKEN (Fly dashboard → Tokens → Deploy token).
name: Deploy server (Fly.io legacy)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'fly.toml'
      - 'pnpm-lock.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
